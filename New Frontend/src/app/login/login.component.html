<div class="login-page">
  <div class="logo-header">
    <h1>E-Paper-Display System</h1>
  </div>
  <div class="login-card">
    <div>
      <h2>Sign In</h2>
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input id="username" type="text" placeholder="Benutzername eingeben" />
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input id="password" type="password" placeholder="Passwort eingeben" />
      </div>
      <button type="button" class="login-btn" (click)="login()">Anmelden</button>
      <p class="help-text">Test: testuser / password</p>
    </div>
  </div>
</div>
