<header class="navbar">
  <div class="navbar-logo">
    <img src="assets/hs-logo.png" alt="Hochschule Esslingen" class="hs-logo" />
  </div>

  <div class="navbar-actions">
    <div class="navbar-group">
      <button class="nav-btn" (click)="zoomOutRequested.emit()" [disabled]="zoomLevel <= zoomMin" title="Verkleinern">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <span class="zoom-label">{{ zoomLevel }}%</span>
      <button class="nav-btn" (click)="zoomInRequested.emit()" [disabled]="zoomLevel >= zoomMax" title="Vergrößern">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
    </div>

    <button class="nav-btn nav-btn-text" (click)="theme.toggle()">
      @if (theme.theme() === 'dark') {
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        Light
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        Dark
      }
    </button>

    <button class="nav-btn nav-btn-text lang-btn" (click)="i18n.toggle()">
      <span [class.lang-active]="i18n.lang() === 'de'">DE</span>
      <span class="lang-sep">/</span>
      <span [class.lang-active]="i18n.lang() === 'en'">EN</span>
    </button>

    <button class="nav-btn nav-btn-text" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      {{ i18n.t.logout }}
    </button>
  </div>
</header>
